# Single-server deployment: PostgreSQL + API + admin portal.
# Put HTTPS in front (e.g. Caddy, nginx or a cloud load balancer) before going live.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mt_tablet
      POSTGRES_USER: mt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt -d mt_tablet"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mt:${POSTGRES_PASSWORD}@db:5432/mt_tablet
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.example.edu}
      ENFORCE_TABLET_BINDING: ${ENFORCE_TABLET_BINDING:-false}
      TRUST_PROXY: "true"
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      STORAGE_DIR: /app/storage
      COLLEGE_TIMEZONE: ${COLLEGE_TIMEZONE:-Asia/Kolkata}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      LIVE_ALLOWED_HOSTS: ${LIVE_ALLOWED_HOSTS:-meet.jit.si,meet.google.com,zoom.us,teams.microsoft.com}
      TEST_GRACE_MINUTES: ${TEST_GRACE_MINUTES:-2}
      GENPREP_DATABASE_URL: ${GENPREP_DATABASE_URL:-}
      GENPREP_MONGO_URI: ${GENPREP_MONGO_URI:-}
      GENPREP_DB_NAME: ${GENPREP_DB_NAME:-}
    volumes:
      - api-storage:/app/storage
    ports:
      - "3000:3000"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  db-data:
  api-storage:
